<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Accounts Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .add-account-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .add-account-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #555;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .accounts-section {
            margin-top: 20px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .account-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .account-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .account-type {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .account-details {
            margin: 15px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #777;
            font-size: 0.9rem;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status.trial {
            background: #fff3cd;
            color: #856404;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: 600;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #777;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-text {
            color: #777;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 SaaS Accounts Dashboard</h1>
            <p class="subtitle">Manage all your SaaS subscriptions in one place</p>
        </header>

        <div class="stats-section" id="statsSection"></div>

        <div class="add-account-section">
            <h2>➕ Add New Account</h2>
            <form id="addAccountForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="serviceName">Service Name</label>
                        <input type="text" id="serviceName" required placeholder="e.g., GitHub">
                    </div>
                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <select id="accountType" required>
                            <option value="">Select Type</option>
                            <option value="Development">Development</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Analytics">Analytics</option>
                            <option value="Cloud">Cloud</option>
                            <option value="Communication">Communication</option>
                            <option value="Productivity">Productivity</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="account@example.com">
                    </div>
                    <div class="form-group">
                        <label for="monthlyCost">Monthly Cost ($)</label>
                        <input type="number" id="monthlyCost" required placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="">Select Status</option>
                            <option value="active">Active</option>
                            <option value="trial">Trial</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="renewalDate">Renewal Date</label>
                        <input type="date" id="renewalDate" required>
                    </div>
                </div>
                <button type="submit" class="btn">Add Account</button>
            </form>
        </div>

        <div class="accounts-section">
            <div class="accounts-grid" id="accountsGrid"></div>
        </div>
    </div>

    <script>
        // Initialize accounts from localStorage or use default data
        let accounts = JSON.parse(localStorage.getItem('saasAccounts')) || [
            {
                id: 1,
                serviceName: 'GitHub',
                accountType: 'Development',
                email: 'dev@company.com',
                monthlyCost: 21.00,
                status: 'active',
                renewalDate: '2025-01-15'
            },
            {
                id: 2,
                serviceName: 'AWS',
                accountType: 'Cloud',
                email: 'cloud@company.com',
                monthlyCost: 450.00,
                status: 'active',
                renewalDate: '2025-02-01'
            },
            {
                id: 3,
                serviceName: 'Google Workspace',
                accountType: 'Productivity',
                email: 'admin@company.com',
                monthlyCost: 144.00,
                status: 'active',
                renewalDate: '2025-01-20'
            },
            {
                id: 4,
                serviceName: 'Slack',
                accountType: 'Communication',
                email: 'team@company.com',
                monthlyCost: 80.00,
                status: 'active',
                renewalDate: '2025-01-10'
            },
            {
                id: 5,
                serviceName: 'Figma',
                accountType: 'Development',
                email: 'design@company.com',
                monthlyCost: 45.00,
                status: 'trial',
                renewalDate: '2025-01-25'
            }
        ];

        // Save accounts to localStorage
        function saveAccounts() {
            localStorage.setItem('saasAccounts', JSON.stringify(accounts));
        }

        // Calculate statistics
        function calculateStats() {
            const totalAccounts = accounts.length;
            const activeAccounts = accounts.filter(a => a.status === 'active').length;
            const totalCost = accounts.reduce((sum, a) => sum + parseFloat(a.monthlyCost), 0);
            
            return { totalAccounts, activeAccounts, totalCost };
        }

        // Render statistics
        function renderStats() {
            const stats = calculateStats();
            const statsSection = document.getElementById('statsSection');
            
            statsSection.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${stats.totalAccounts}</div>
                    <div class="stat-label">Total Accounts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.activeAccounts}</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">$${stats.totalCost.toFixed(2)}</div>
                    <div class="stat-label">Monthly Cost</div>
                </div>
            `;
        }

        // Render accounts
        function renderAccounts() {
            const grid = document.getElementById('accountsGrid');
            
            if (accounts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p class="empty-state-text">No accounts yet. Add your first SaaS account above!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = accounts.map(account => `
                <div class="account-card">
                    <div class="account-header">
                        <div class="account-name">${account.serviceName}</div>
                        <div class="account-type">${account.accountType}</div>
                    </div>
                    <div class="account-details">
                        <div class="detail-row">
                            <span class="detail-label">Email</span>
                            <span class="detail-value">${account.email}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Monthly Cost</span>
                            <span class="detail-value">$${parseFloat(account.monthlyCost).toFixed(2)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status</span>
                            <span class="detail-value"><span class="status ${account.status}">${account.status.toUpperCase()}</span></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Renewal Date</span>
                            <span class="detail-value">${new Date(account.renewalDate).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteAccount(${account.id})">🗑️ Delete Account</button>
                </div>
            `).join('');
        }

        // Add account
        document.getElementById('addAccountForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newAccount = {
                id: Date.now(),
                serviceName: document.getElementById('serviceName').value,
                accountType: document.getElementById('accountType').value,
                email: document.getElementById('email').value,
                monthlyCost: parseFloat(document.getElementById('monthlyCost').value),
                status: document.getElementById('status').value,
                renewalDate: document.getElementById('renewalDate').value
            };
            
            accounts.push(newAccount);
            saveAccounts();
            renderAccounts();
            renderStats();
            this.reset();
        });

        // Delete account
        function deleteAccount(id) {
            if (confirm('Are you sure you want to delete this account?')) {
                accounts = accounts.filter(account => account.id !== id);
                saveAccounts();
                renderAccounts();
                renderStats();
            }
        }

        // Initial render
        renderStats();
        renderAccounts();
    </script>
</body>
</html>
